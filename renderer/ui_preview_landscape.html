<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>/* PianoClick 横屏界面样式 - 整体滚动版 */
* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  outline: none;
}

:root {
  --bg: #1A1C2E;
  --bg-deep: #12141f;
  --card: #252840;
  --card-hover: #2b2f4b;
  --divider: #3A4056;
  --divider-soft: #2a2e45;
  --track-bg: #4A4D5A;
  --thumb-bg: #757b91;
  --track-inactive: #8a93a8;
  --accent: #FF8800;
  --accent-soft: #FFB27E;
  --accent-softest: #FFD9B8;
  --accent-bright: #FF7E5F;
  --accent-grad-end: #FEB47B;
  --accent-text: #1a1c2e;
  --float-bg: #262B44E6;
  --float-border: #332A3A5A;
  --text-primary: #FFFFFF;
  --text-secondary: #AAB2C6;
  --text-tertiary: #9AA3BC;
  --text-dim: #5A6080;
  --folder-blue: #BFD3FF;
  --close-red: #E05555;
  --press-ring: rgba(255,255,255,.14);
  --accent-ring: #FF880047;
  --ease-soft: cubic-bezier(.4, 0, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-snap: cubic-bezier(.25, .8, .25, 1);
  --scrollbar-thumb: var(--accent);
  --scrollbar-track: rgba(255,255,255,0.06);
}

body {
  background: var(--bg-deep);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body.app-body { background: transparent; margin: 0; overflow: hidden; height: 100vh; }
.app-body .view { display: none; }
.app-body .view.active { display: block; height: 100vh; }

body.view-float, body.view-popup { background: transparent; }
body.view-float .view.active, body.view-popup .view.active { background: transparent; }

/* ============================================================
   主界面 - 整体滚动
   ============================================================ */
.main-root {
  width: 100%;
  max-width: 1080px;
  min-width: 640px;
  margin: 0 auto;
  padding: 20px 24px 24px;
  box-sizing: border-box;
  background: var(--bg);
  border-radius: 4px;
  box-shadow: 0 8px 40px rgba(0,0,0,.5);
  overflow-y: auto;
  overflow-x: hidden;
  max-height: 100vh;
  height: 100vh;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  scrollbar-gutter: stable;
}

.main-root::-webkit-scrollbar {
  width: 5px;
}
.main-root::-webkit-scrollbar-track {
  background: var(--scrollbar-track);
  border-radius: 10px;
  margin: 8px 0;
}
.main-root::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 10px;
  min-height: 40px;
  transition: background 0.3s ease;
}
.main-root::-webkit-scrollbar-thumb:hover {
  background: var(--accent-bright);
  opacity: 0.9;
}
.main-root {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
}

.main-root .main-title {
  color: var(--text-primary);
  font-size: 24px;
  font-weight: bold;
  text-align: left;
  margin: 0 0 16px;
}

.landscape-columns {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  min-height: 0;
}

.landscape-left {
  flex: 0 0 340px;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.landscape-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.card {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card);
  padding: 16px;
  border-radius: 4px;
  margin-bottom: 12px;
  min-height: 56px;
}
.card-label { color: var(--text-primary); font-size: 16px; }

.hint {
  color: var(--text-tertiary);
  font-size: 12px;
  line-height: 1.6;
  margin: 2px 0 20px;
}

.list-header {
  display: flex; align-items: center;
  margin-bottom: 10px;
}
.list-title {
  flex: 1;
  color: var(--text-primary); font-size: 16px; font-weight: bold;
}

.btn {
  border: none; cursor: pointer;
  height: 36px; padding: 0 14px;
  border-radius: 4px;
  color: var(--text-primary);
  font-size: 12px;
  font-family: inherit;
  transition: background .2s var(--ease-soft), transform .18s var(--ease-spring), box-shadow .25s var(--ease-soft), filter .2s var(--ease-soft);
}
.btn-folder { background: var(--accent-softest); color: #1a1c2e; margin-right: 8px; }
.btn-folder:active { box-shadow: 0 0 0 4px var(--accent-ring); }
.btn-import { background: var(--accent-soft); color: var(--accent-text); font-weight: bold; }
.btn-import:active { box-shadow: 0 0 0 4px var(--accent-ring); }

.playlist {
  background: var(--card);
  border-radius: 4px;
  overflow-y: auto;
  overflow-x: hidden;
  max-height: 400px;
  -webkit-overflow-scrolling: touch;
  scrollbar-gutter: stable;
}
.playlist::-webkit-scrollbar { width: 5px; }
.playlist::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 10px; margin: 8px 0; }
.playlist::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; min-height: 40px; }
.playlist { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }

.pl-item {
  display: flex; align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--divider-soft);
  cursor: pointer;
  border-radius: 4px;
  transition: background .2s var(--ease-soft), box-shadow .25s var(--ease-soft);
}
.pl-item:last-child { border-bottom: none; }
.pl-item:hover { background: var(--card-hover); }
.pl-item:active { background: var(--accent-soft); opacity: .9; box-shadow: inset 0 0 0 2px var(--accent-ring); }
.pl-info { flex: 1; min-width: 0; }
.pl-name {
  color: var(--text-primary);
  font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pl-del {
  color: var(--text-dim); font-size: 14px;
  padding: 4px 6px; margin-left: 8px;
  border-radius: 50%;
  transition: color .2s var(--ease-soft), transform .18s var(--ease-spring), box-shadow .25s var(--ease-soft), background .2s var(--ease-soft);
}
.pl-del:active { transform: scale(1.15); color: var(--close-red); background: rgba(224,85,85,.2); box-shadow: 0 0 0 4px rgba(224,85,85,.25); }
.pl-del:hover { color: var(--close-red); }

/* 开关 */
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch:active .slider { box-shadow: 0 0 0 2px var(--accent-ring); }
.slider {
  position: absolute; inset: 0; cursor: pointer;
  background: var(--track-bg); border-radius: 12px;
  transition: background .25s var(--ease-soft);
}
.slider::before {
  content: ""; position: absolute;
  width: 20px; height: 20px; left: 2px; top: 2px;
  background: var(--thumb-bg); border-radius: 50%;
  transition: transform .3s var(--ease-spring), background .25s var(--ease-soft);
  will-change: transform;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }

/* ============================================================
   悬浮窗 - 自适应放大版
   ============================================================ */
.float-root {
  width: 100%;
  min-width: 100%;
  max-width: 100%;
  background: var(--float-bg);
  border: 1px solid var(--float-border);
  border-radius: 18px;
  padding: 12px;
  box-sizing: border-box;
  max-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}
.float-root::-webkit-scrollbar {
  width: 4px;
}
.float-root::-webkit-scrollbar-track {
  background: transparent;
}
.float-root::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 2px;
}
.float-root {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.grabber {
  position: relative;
  height: 16px;
  margin-bottom: 6px;
  -webkit-app-region: drag;
}
.grabber-bar {
  position: absolute; top: 50%; left: 0; right: 0;
  height: 3px; background: var(--divider);
  transform: translateY(-50%);
  pointer-events: none;
}
.grabber-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 11px;
  pointer-events: none;
}
.float-title-block { width: 100%; margin-bottom: 8px; }
.float-title {
  color: var(--text-primary);
  font-size: 18px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.float-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.3s ease;
}
.float-detect-hint {
  margin-top: 2px;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.seek-row {
  display: flex; align-items: center;
  margin-top: 8px;
}
.time-txt {
  color: var(--text-tertiary);
  font-size: 12px;
  white-space: nowrap;
  width: 50px;
  flex: 0 0 50px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.seekbar { position: relative; flex: 1; margin: 0 9px; height: 22px; cursor: pointer; touch-action: none; }
.seekbar-track {
  position: absolute; top: 50%; left: 0; right: 0;
  height: 6px; transform: translateY(-50%);
  background: var(--track-bg); border-radius: 3px;
}
.seekbar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(to right, var(--accent-bright), var(--accent-grad-end));
}
.seekbar-thumb {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent-bright);
  border: 2px solid #FFFFFF;
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}

.speed-row {
  display: flex; align-items: center;
  margin-top: 6px;
}
.speed-label { color: var(--text-tertiary); font-size: 11px; margin-right: 2px; }
.speed-btn {
  color: var(--accent-soft);
  font-size: 20px;
  font-weight: bold;
  width: 22px;
  height: 22px;
  line-height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  transition: background .15s var(--ease-soft), transform .15s var(--ease-spring), box-shadow .25s var(--ease-soft);
}
.speed-btn:active { background: rgba(255,255,255,.18); transform: scale(1.15); box-shadow: 0 0 0 5px var(--press-ring); }
.seek-speed { margin: 0 9px; }
.speed-value {
  color: var(--accent-soft);
  font-size: 13px;
  font-weight: bold;
  width: 40px;
  flex: 0 0 40px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ctrl-row {
  display: flex; align-items: center; justify-content: center;
  margin-top: 6px;
}
.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px;
  height: 36px;
  cursor: pointer;
  border-radius: 50%;
  transition: background .2s var(--ease-soft), transform .18s var(--ease-spring), box-shadow .25s var(--ease-soft);
}
.icon-btn:active {
  transform: scale(.88);
  box-shadow: 0 0 0 5px rgba(255,255,255,.10);
}
.icon-btn:hover { background: rgba(255,255,255,.08); }
.icon-btn.icon-neu { color: var(--text-secondary); }
.icon-btn.icon-folder { color: var(--folder-blue); }
.play-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  margin: 0 8px;
  background: var(--accent-bright);
  border: 2px solid var(--accent-soft);
  border-radius: 50%;
  cursor: pointer;
  transition: transform .2s var(--ease-spring), box-shadow .25s var(--ease-soft);
}
.play-btn:active {
  transform: scale(.9);
  box-shadow: 0 0 0 6px rgba(255,255,255,.18);
  filter: brightness(1.12);
}
.close-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--close-red);
  font-size: 16px;
  font-weight: bold;
  margin-left: 4px;
  cursor: pointer;
  border-radius: 50%;
  transition: background .2s var(--ease-soft), transform .18s var(--ease-spring), box-shadow .25s var(--ease-soft);
}
.close-btn:active {
  transform: scale(.85);
  background: rgba(224,85,85,.28);
  box-shadow: 0 0 0 5px rgba(224,85,85,.25);
}
.close-btn:hover { background: rgba(224,85,85,.15); }

.track-section { margin-top: 8px; }
.track-toggle {
  color: var(--text-secondary);
  font-size: 14px;
  padding: 6px 0;
  cursor: pointer;
  border-radius: 4px;
  transition: background .15s var(--ease-soft), box-shadow .25s var(--ease-soft);
  user-select: none;
}
.track-toggle:active { background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 2px var(--accent-ring); }

.track-scroll {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-4px);
  transition: max-height .3s var(--ease-soft), opacity .25s var(--ease-soft), transform .25s var(--ease-soft);
  width: 100%;
}
.track-scroll.open {
  max-height: 90px;
  opacity: 1;
  transform: translateY(0);
  overflow-x: auto;
  overflow-y: hidden;
  cursor: grab;
}
.track-scroll.open:active {
  cursor: grabbing;
}
.track-scroll::-webkit-scrollbar {
  height: 5px;
}
.track-scroll::-webkit-scrollbar-track {
  background: var(--scrollbar-track);
  border-radius: 4px;
}
.track-scroll::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 4px;
}
.track-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--accent-bright);
}
.track-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
}

.track-list {
  display: inline-flex;
  gap: 16px;
  padding: 6px 4px;
  align-items: stretch;
  min-width: 100%;
  width: max-content;
}
.track-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background .2s var(--ease-soft), box-shadow .25s var(--ease-soft);
  flex-shrink: 0;
}
.track-item:active { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.track-checkbox {
  width: 18px; height: 18px; flex-shrink: 0;
  border: 2px solid var(--track-inactive);
  border-radius: 3px;
  background: transparent;
  position: relative;
  transition: background .2s var(--ease-soft), border-color .2s var(--ease-soft);
}
.track-checkbox::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 5px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0);
  transition: transform .25s var(--ease-spring);
  will-change: transform;
}
.track-item.checked .track-checkbox {
  background: var(--accent);
  border-color: var(--accent);
}
.track-item.checked .track-checkbox::after { transform: rotate(45deg) scale(1); }
.track-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1.2;
}
.track-name {
  color: var(--text-secondary);
  font-size: 14px;
}
.track-count {
  color: var(--text-dim);
  font-size: 12px;
}

/* ============================================================
   弹出播放列表 - 自适应放大版
   ============================================================ */
.popup-root {
  width: 100%;
  min-width: 100%;
  max-width: 100%;
  height: 100%;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--float-bg);
  border: 1px solid var(--float-border);
  border-radius: 18px;
  padding: 16px;
  box-sizing: border-box;
}
.popup-header {
  display: flex; align-items: center;
  margin-bottom: 10px;
}
.popup-title {
  flex: 1;
  color: var(--text-primary);
  font-size: 16px;
  font-weight: bold;
}
.popup-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  border-radius: 4px;
  scrollbar-gutter: stable;
}
.popup-list::-webkit-scrollbar { width: 5px; }
.popup-list::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 10px; margin: 8px 0; }
.popup-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; min-height: 40px; }
.popup-list .pl-item { background: transparent; }

/* ============================================================
   主题色设置（可折叠）
   ============================================================ */
.theme-card {
  flex-direction: column;
  align-items: stretch;
  padding: 0;
  overflow: visible;
}

.theme-toggle {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%;
  padding: 16px;
  min-height: 56px;
  cursor: pointer;
  color: var(--text-primary); font-size: 16px;
  border-radius: 4px;
  transition: background .15s var(--ease-soft), box-shadow .25s var(--ease-soft);
  position: relative;
  z-index: 2;
}
.theme-toggle:active { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px var(--accent-ring); }
.theme-toggle .card-label { flex: 1; }
.theme-toggle .arrow {
  color: var(--text-secondary); font-size: 12px;
  transition: transform .3s var(--ease-soft);
  will-change: transform;
}
.theme-card.expanded .theme-toggle .arrow { transform: rotate(180deg); }

.theme-body {
  display: flex;
  max-height: 0;
  opacity: 0;
  overflow: visible;
  flex-direction: column;
  gap: 14px;
  padding: 0 16px;
  transform: translateY(-6px);
  transition: max-height .35s var(--ease-soft), opacity .3s var(--ease-soft), padding .35s var(--ease-soft), transform .3s var(--ease-soft);
  pointer-events: none;
  position: relative;
  z-index: 1;
}
.theme-card.expanded .theme-body {
  max-height: 500px;
  opacity: 1;
  padding: 12px 16px 16px;
  transform: translateY(0);
  pointer-events: auto;
}

.theme-swatches {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.swatch {
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  position: relative;
  transition: transform .25s var(--ease-spring), border-color .2s var(--ease-soft), box-shadow .25s var(--ease-soft);
  will-change: transform;
}
.swatch:hover { transform: scale(1.12); }
.swatch:active { transform: scale(.92); filter: brightness(1.15); box-shadow: 0 0 0 4px rgba(255,255,255,.22); }
.swatch.active { border-color: #fff; }
.swatch.active::after {
  content: ""; position: absolute; inset: 0;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,255,255,.25);
}
.custom-picker {
  display: flex; align-items: center; gap: 10px;
  margin-top: 2px;
}
.theme-hint {
  color: var(--text-tertiary);
  font-size: 12px;
}
.btn-palette {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border: 2px solid var(--divider);
  border-radius: 50%;
  background: var(--card);
  color: var(--text-primary);
  font-size: 16px;
  font-family: inherit;
  padding: 0;
  cursor: pointer;
  transition: transform .25s var(--ease-spring), border-color .2s var(--ease-soft), box-shadow .25s var(--ease-soft), background .2s var(--ease-soft);
}
.btn-palette:hover { background: var(--card-hover); border-color: var(--accent-soft); }
.btn-palette:active { transform: scale(.92); filter: brightness(1.15); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
.palette-emoji { line-height: 1; font-size: 16px; }

#donate-card .theme-body {
  pointer-events: none;
}
#donate-card.expanded .theme-body {
  pointer-events: auto;
}

/* ============================================================
   调色盘弹窗
   ============================================================ */
.palette-mask {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .55);
  opacity: 0; pointer-events: none;
  transition: opacity .25s var(--ease-soft);
}
.palette-mask.open { opacity: 1; pointer-events: auto; }

.palette-dialog {
  width: 300px; max-width: calc(100vw - 48px);
  background: var(--bg);
  border: 1px solid var(--divider);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, .55);
  transform: translateY(12px) scale(.96);
  transition: transform .3s var(--ease-spring);
  will-change: transform;
}
.palette-mask.open .palette-dialog { transform: translateY(0) scale(1); }

.palette-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.palette-title { color: var(--text-primary); font-size: 16px; font-weight: bold; }

.palette-canvas {
  position: relative;
  height: 180px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--divider);
  cursor: crosshair;
  touch-action: none;
  background-color: #fff;
}
.palette-canvas::before {
  content: ""; position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to bottom, #fff, rgba(255,255,255,0)),
    linear-gradient(to right, rgba(0,0,0,0), #000);
}
.palette-canvas::after {
  content: ""; position: absolute; inset: 0;
  pointer-events: none;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}
.palette-thumb {
  position: absolute;
  width: 18px; height: 18px;
  margin: -9px 0 0 -9px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
  pointer-events: none;
  background: var(--accent);
}

.palette-sat-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: 14px;
}
.palette-sat-label { color: var(--text-tertiary); font-size: 12px; white-space: nowrap; }
.palette-satbar {
  position: relative; flex: 1; height: 20px;
  cursor: pointer; touch-action: none;
}
.palette-sat-track {
  position: absolute; top: 50%; left: 0; right: 0;
  height: 8px; transform: translateY(-50%);
  border-radius: 4px;
  background: linear-gradient(to right, #FF8800, #000);
}
.palette-sat-fill {
  height: 100%; border-radius: 3px;
}
.palette-sat-thumb {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff;
  border: 2px solid var(--accent);
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}

.palette-preview {
  display: flex; align-items: center; gap: 10px;
  margin-top: 14px;
}
.palette-preview-label { color: var(--text-tertiary); font-size: 12px; }
.palette-preview-box {
  width: 40px; height: 26px;
  border-radius: 4px;
  border: 1px solid var(--divider);
  background: var(--accent);
  transition: background .15s var(--ease-soft);
}
.palette-preview-hex {
  color: var(--text-primary); font-size: 13px;
  font-family: ui-monospace, "SF Mono", monospace;
  letter-spacing: .5px;
}

.palette-recents {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 14px;
  min-height: 16px;
}
.palette-recents-label {
  width: 100%; color: var(--text-dim); font-size: 11px;
}
.palette-recent {
  width: 24px; height: 24px; border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform .2s var(--ease-spring), border-color .2s var(--ease-soft);
}
.palette-recent:hover { transform: scale(1.15); }
.palette-recent:active { transform: scale(.9); filter: brightness(1.15); box-shadow: 0 0 0 3px rgba(255,255,255,.22); }
.palette-recent.active { border-color: #fff; }

.palette-actions {
  display: flex; justify-content: flex-end; gap: 10px;
  margin-top: 16px;
}
.btn-palette-cancel {
  background: var(--card); color: var(--text-primary);
  border: 1px solid var(--divider);
  transition: background .2s var(--ease-soft), box-shadow .25s var(--ease-soft);
}
.btn-palette-cancel:hover { background: var(--card-hover); }
.btn-palette-cancel:active { background: var(--card-hover); box-shadow: 0 0 0 4px rgba(255,255,255,.12); }
.btn-palette-ok {
  background: var(--accent); color: var(--accent-text);
  font-weight: bold;
  transition: background .2s var(--ease-soft), box-shadow .25s var(--ease-soft), filter .2s var(--ease-soft);
}
.btn-palette-ok:hover { background: var(--accent-soft); color: var(--accent-text); }
.btn-palette-ok:active { filter: brightness(1.12); box-shadow: 0 0 0 4px var(--accent-ring); }

/* 给作者捐赠 */
.donate-images {
  display: flex;
  gap: 10px;
}
.donate-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.donate-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: transform .2s var(--ease-spring), box-shadow .25s var(--ease-soft), filter .2s var(--ease-soft);
}
.donate-img:active {
  transform: scale(.96);
  filter: brightness(1.08);
  box-shadow: 0 0 0 4px var(--accent-ring);
}
.donate-label {
  color: var(--text-secondary);
  font-size: 12px;
}
.donate-greet {
  color: var(--accent-soft);
  font-size: 12px;
  text-align: center;
}
.donate-tip {
  color: var(--text-tertiary);
  font-size: 12px;
  text-align: center;
}

   触屏设备
   ============================================================ */
@media (hover: none), (pointer: coarse) {
  .icon-btn:hover,
  .close-btn:hover,
  .pl-del:hover,
  .swatch:hover,
  .palette-recent:hover,
  .btn-palette:hover,
  .btn-palette-cancel:hover,
  .btn-palette-ok:hover {

    const params = new URLSearchParams(location.search);
    const viewName = params.get('view') || 'main';

    let curTotalMs = 0;

    // ---------- Toast 提示 ----------
    function showToast(text, duration = 2000) {
      let toast = document.getElementById('__toast__');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = '__toast__';
        toast.style.cssText = `
          position: fixed;
          left: 50%;
          bottom: 40px;
          transform: translateX(-50%) translateY(20px);
          background: rgba(0,0,0,.85);
          color: #fff;
          padding: 10px 18px;
          border-radius: 8px;
          font-size: 13px;
          line-height: 1.5;
          white-space: pre-line;
          text-align: center;
          z-index: 9999;
          opacity: 0;
          pointer-events: none;
          transition: opacity .25s ease, transform .25s ease;
          max-width: 80%;
          box-shadow: 0 4px 16px rgba(0,0,0,.4);
        `;
        document.body.appendChild(toast);
      }
      toast.textContent = text;
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      if (toast._timer) clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
      }, duration);
    }

    function show(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      if (view === 'all') {
        document.body.classList.add('preview-all');
        document.querySelectorAll('.view').forEach(v => v.classList.add('active'));
        return;
      }
      document.body.classList.remove('preview-all');
      document.body.classList.remove('view-float', 'view-popup');
      if (view === 'float') document.body.classList.add('view-float');
      if (view === 'popup') document.body.classList.add('view-popup');
      const el = document.getElementById('view-' + view);
      if (el) el.classList.add('active');
    }
    show(viewName);

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());

    (function initTouchFeedback() {
      const release = () => {
        const el = document.activeElement;
        if (el && el.blur && el !== document.body && el.tagName !== 'INPUT') {

      if ('ontouchstart' in window) {

        document.addEventListener('touchcancel', release, { passive: true });

    // ---------- 主题色 ----------
    const DEFAULT_ACCENT = '#FF8800';
    const root = document.documentElement;

    function hexToHsl(hex) {
      if (!hex || typeof hex !== 'string' || !hex.startsWith('#')) hex = DEFAULT_ACCENT;
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }
    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      const to = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
      return '#' + to(r) + to(g) + to(b);
    }
    function hsvToHex(h, s, v) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      v = Math.max(0, Math.min(100, v)) / 100;
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      const to = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
      return '#' + to(r) + to(g) + to(b);
    }
    function hexToHsv(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      const s = max === 0 ? 0 : d / max;
      return { h: Math.round(h), s: Math.round(s * 100), v: Math.round(max * 100) };
    }
    function contrastText(hex) {
      return hexToHsl(hex).l > 60 ? '#1a1c2e' : '#FFFFFF';
    }
    function deriveBg(hex) {
      const { h, s, l } = hexToHsl(hex);
      const bgSat = Math.max(18, Math.min(35, s * 0.4));
      const bgLight = Math.max(10, Math.min(16, l * 0.25));
      return hslToHex(h, bgSat, bgLight);
    }
    function deriveFloatBg(hex) {
      const { h, s, l } = hexToHsl(hex);
      const fSat = Math.max(20, Math.min(40, s * 0.45));
      const fLight = Math.max(12, Math.min(20, l * 0.3));
      return '#' + hslToHex(h, fSat, fLight).slice(1) + 'E6';
    }

    function applyAccent(hex) {
      if (!hex || typeof hex !== 'string' || !hex.startsWith('#')) hex = DEFAULT_ACCENT;
      const { h, s, l } = hexToHsl(hex);
      const soft = hslToHex(h, Math.max(30, s - 8), Math.min(88, l + 28));
      const softest = hslToHex(h, Math.max(22, s - 14), Math.min(94, l + 44));
      const bright = hslToHex(h, s, Math.min(78, l + 8));
      const gradEnd = hslToHex(h, Math.max(25, s - 12), Math.min(92, l + 34));
      root.style.setProperty('--accent', hex);
      root.style.setProperty('--accent-soft', soft);
      root.style.setProperty('--accent-softest', softest);
      root.style.setProperty('--accent-bright', bright);
      root.style.setProperty('--accent-grad-end', gradEnd);
      root.style.setProperty('--accent-text', contrastText(hex));
      root.style.setProperty('--accent-ring', hex + '47');
      root.style.setProperty('--scrollbar-thumb', hex);
      root.style.setProperty('--scrollbar-track', 'rgba(255,255,255,0.06)');
      const bg = deriveBg(hex);
      root.style.setProperty('--bg', bg);
      root.style.setProperty('--float-bg', deriveFloatBg(hex));
      root.style.setProperty('--bg-deep', hslToHex(h, Math.max(20, s * 0.5), Math.max(5, l * 0.14)));
      root.style.setProperty('--card', hslToHex(h, Math.max(16, s * 0.35), Math.max(12, l * 0.3)));
      root.style.setProperty('--card-hover', hslToHex(h, Math.max(18, s * 0.4), Math.max(14, l * 0.36)));
      root.style.setProperty('--divider', hslToHex(h, Math.max(14, s * 0.3), Math.max(18, l * 0.45)));
      root.style.setProperty('--divider-soft', hslToHex(h, Math.max(14, s * 0.3), Math.max(13, l * 0.32)));
      root.style.setProperty('--track-bg', hslToHex(h, Math.max(10, s * 0.25), Math.max(20, l * 0.5)));
      root.style.setProperty('--thumb-bg', hslToHex(h, Math.max(8, s * 0.2), Math.max(34, l * 0.75)));
      root.style.setProperty('--track-inactive', hslToHex(h, Math.max(8, s * 0.2), Math.max(40, l * 0.85)));
      root.style.setProperty('--text-secondary', hslToHex(h, Math.max(10, s * 0.3), Math.max(60, Math.min(78, l * 1.6))));
      root.style.setProperty('--text-tertiary', hslToHex(h, Math.max(8, s * 0.25), Math.max(55, Math.min(72, l * 1.5))));
      root.style.setProperty('--text-dim', hslToHex(h, Math.max(8, s * 0.2), Math.max(38, Math.min(50, l * 1.1))));
      root.style.setProperty('--folder-blue', hslToHex(h, Math.max(60, s), Math.min(85, l + 40)));
    }

    (function initPalette() {

      const satbar = document.getElementById('palette-satbar');
      const satThumb = document.getElementById('palette-sat-thumb');
      const satFill = document.getElementById('palette-sat-fill');
      if (!mask || !canvas) return;

      const PRESET_COLORS = [
        '#FF8800', '#FF5722', '#F44336', '#E91E63', '#9C27B0', '#673AB7',
        '#3F51B5', '#4C8BF5', '#2196F3', '#03A9F4', '#00BCD4', '#009688',
        '#3ECF8E', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#F5C24C',
        '#FF9800', '#795548', '#9E9E9E', '#607D8B', '#B072F5', '#FF6B81'
      ];
      const recentColors = [];

      let currentColor = DEFAULT_ACCENT;
      let curH = 0, curS = 100, curV = 100;
      let lastCommitted = DEFAULT_ACCENT;

      const thumb = document.createElement('div');
      thumb.className = 'palette-thumb';
      canvas.appendChild(thumb);

      const satTrack = document.getElementById('palette-sat-track');

      function buildHueGradient() {
        const stops = [];
        for (let i = 0; i <= 12; i++) {
          const h = Math.round(i / 12 * 360);
          stops.push(hsvToHex(h, 100, 100) + ' ' + (i / 12 * 100) + '%');
        }
        return 'linear-gradient(to right, ' + stops.join(', ') + ')';
      }
      function renderCanvasHue() {
        canvas.style.backgroundImage = buildHueGradient();
      }
      function renderSatTrack() {
        if (!satTrack) return;
        const pure = hsvToHex(curH, 100, 100);
        satTrack.style.background = 'linear-gradient(to right, ' + pure + ', #000)';
      }

      function updatePreview(color) {
        previewBox.style.background = color;
        previewHex.textContent = color.toUpperCase();
      }
      function setCurrent(color) {
        currentColor = color;
        updatePreview(color);
      }

      function placeThumb(color) {
        const { h, s, v } = hexToHsv(color);
        curH = h; curS = s; curV = v;
        const rect = canvas.getBoundingClientRect();
        const x = (h / 360) * rect.width;
        const y = (s / 100) * rect.height;
        thumb.style.left = x + 'px';
        thumb.style.top = y + 'px';
        thumb.style.background = color;
        updateSatUI();
        renderSatTrack();
      }

      function updateSatUI() {
        const pct = curV + '%';
        if (satThumb) satThumb.style.left = pct;
        if (satFill) satFill.style.width = pct;
      }

      function refreshColor() {
        const color = hsvToHex(curH, curS, curV);
        setCurrent(color);
        thumb.style.background = color;
        renderSatTrack();
      }

      function pick(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const px = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
        const py = Math.max(0, Math.min(1, (cy - rect.top) / rect.height));
        curH = Math.round(px * 360);
        curS = Math.round(py * 100);
        const x = px * rect.width, y = py * rect.height;
        thumb.style.left = x + 'px';
        thumb.style.top = y + 'px';
        refreshColor();
      }

      canvas.addEventListener('mousedown', e => {
        pick(e);
        const move = ev => pick(ev);
        const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
      canvas.addEventListener('touchstart', e => { e.preventDefault(); pick(e); }, { passive: false });
      canvas.addEventListener('touchmove', e => { e.preventDefault(); pick(e); }, { passive: false });

      function bindSatDrag() {
        if (!satbar) return;
        let dragging = false;
        const ratioFromEvent = (e) => {
          const rect = satbar.getBoundingClientRect();
          const cx = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
          let r = (cx - rect.left) / rect.width;
          if (r < 0) r = 0;
          if (r > 1) r = 1;
          return r;
        };
        const apply = (r) => {
          curV = Math.round(r * 100);
          updateSatUI();
          refreshColor();
        };
        const start = (e) => {
          dragging = true;
          apply(ratioFromEvent(e));
          if (e.cancelable) e.preventDefault();
        };
        const move = (e) => {
          if (!dragging) return;
          if (e.cancelable) e.preventDefault();
          apply(ratioFromEvent(e));
        };
        const end = () => { dragging = false; };
        satbar.addEventListener('mousedown', start);
        satbar.addEventListener('touchstart', start, { passive: false });
        satbar.addEventListener('mousemove', move);
        satbar.addEventListener('touchmove', move, { passive: false });
        document.addEventListener('mouseup', end);
        document.addEventListener('touchend', end);
        document.addEventListener('touchcancel', end);
      }
      bindSatDrag();

      function renderColorBoard() {
        recentsCont.innerHTML = '';
        const presetLabel = document.createElement('div');
        presetLabel.className = 'palette-recents-label';
        presetLabel.textContent = '预设颜色';
        recentsCont.appendChild(presetLabel);
        PRESET_COLORS.forEach(c => {
          const el = document.createElement('span');
          el.className = 'palette-recent preset';
          el.style.background = c;
          el.title = c;
          el.addEventListener('click', () => {
            setCurrent(c);
            placeThumb(c);
            recentsCont.querySelectorAll('.palette-recent').forEach(r => r.classList.remove('active'));
            el.classList.add('active');
          });
          recentsCont.appendChild(el);
        });
        if (recentColors.length > 0) {
          const recentLabel = document.createElement('div');
          recentLabel.className = 'palette-recents-label';
          recentLabel.textContent = '最近使用';
          recentsCont.appendChild(recentLabel);
          recentColors.forEach(c => {
            const el = document.createElement('span');
            el.className = 'palette-recent recent';
            el.style.background = c;
            el.title = c;
            el.addEventListener('click', () => {
              setCurrent(c);
              placeThumb(c);
              recentsCont.querySelectorAll('.palette-recent').forEach(r => r.classList.remove('active'));
              el.classList.add('active');
            });
            recentsCont.appendChild(el);
          });
        }
      }

      function open() {
        lastCommitted = currentColor;
        setCurrent(lastCommitted);
        renderCanvasHue();
        renderColorBoard();
        requestAnimationFrame(() => {
          placeThumb(lastCommitted);
          renderSatTrack();
        });
        mask.classList.add('open');
      }
      function commit() {
        const color = currentColor;
        applyAccent(color);
        markActiveSwatch(null);
        document.querySelectorAll('.swatch').forEach(sw => {
          if (sw.dataset.color === color) markActiveSwatch(sw);
        });
        if (!recentColors.includes(color)) {
          recentColors.unshift(color);
          if (recentColors.length > 8) recentColors.pop();
        }
        if (window.AndroidBridge && window.AndroidBridge.onThemeChanged) {
          window.AndroidBridge.onThemeChanged(color);
        }
        mask.classList.remove('open');
      }
      function cancel() {
        setCurrent(lastCommitted);
        requestAnimationFrame(() => placeThumb(lastCommitted));
        mask.classList.remove('open');
      }

      if (btnPalette) btnPalette.addEventListener('click', open);
      if (btnClose) btnClose.addEventListener('click', cancel);
      if (btnCancel) btnCancel.addEventListener('click', cancel);
      if (btnOk) btnOk.addEventListener('click', commit);
      mask.addEventListener('click', e => { if (e.target === mask) cancel(); });
    })();

    // ---------- 捐赠 ----------
    const donateCard = document.getElementById('donate-card');
    const donateToggle = document.getElementById('donate-toggle');
    if (donateCard && donateToggle) {
      const donateArrow = donateToggle.querySelector('.arrow');

    // ---------- 捐赠图片长按保存 ----------
    document.querySelectorAll('.donate-img').forEach(img => {
      let longPressTimer = null;
      let isLongPress = false;
      
      function saveImage() {
        if (isLongPress) return;
        isLongPress = true;
        const src = img.getAttribute('src');
        
        let promise;
        if (window.AndroidBridge && window.AndroidBridge.onSaveImage) {
          promise = window.AndroidBridge.onSaveImage(src);
        } else if (window.electronAPI && window.electronAPI.sendSaveImage) {
          promise = window.electronAPI.sendSaveImage(src);
        }
        
        if (promise && typeof promise.then === 'function') {
          promise.then(result => {
            if (result && result.success) {
              showToast('已保存到下载目录：' + (result.name || ''));
            } else {
              showToast('保存失败: ' + ((result && result.error) || '未知错误'));
            }
          }).catch(err => {
            showToast('保存失败: ' + err.message);
          });
        }
        
        setTimeout(() => { isLongPress = false; }, 800);
      }
      
      img.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        isLongPress = false;
        longPressTimer = setTimeout(function() { longPressTimer = null; saveImage(); }, 500);
      });
      img.addEventListener('mouseup', function(e) {
        if (e.button !== 0) return;
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      });
      img.addEventListener('mouseleave', function() {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      });
      img.addEventListener('touchstart', function(e) {
        isLongPress = false;
        longPressTimer = setTimeout(function() { longPressTimer = null; saveImage(); }, 500);
      }, { passive: true });
      img.addEventListener('touchend', function() {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      }, { passive: true });
      img.addEventListener('touchmove', function() {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      }, { passive: true });

    // ---------- 倍速按钮 ----------
    const btnSpeedMinus = document.getElementById('btn-speed-minus');
    const btnSpeedPlus = document.getElementById('btn-speed-plus');
    const speedValueEl = document.getElementById('tv-speed-value');

    function fetchSpeed() {
      if (window.AndroidBridge && window.AndroidBridge.getSpeed) {
        window.AndroidBridge.getSpeed().then(function(speed) {
          if (speed !== undefined && speed !== null) { updateSpeedDisplay(speed); }
        }).catch(function(e) {});
      }
    }

    function updateSpeedDisplay(speed) {
      speed = Math.round(speed / 0.05) * 0.05;
      if (speed < 0.05) speed = 0.05;
      if (speed > 2.0) speed = 2.0;
      if (speedValueEl) { speedValueEl.textContent = '×' + speed.toFixed(2); }
      const level = (speed - 0.05) / 0.05;
      const pct = Math.max(0, Math.min(100, (level / 39) * 100));
      if (speedFill) speedFill.style.width = pct + '%';
      if (speedThumb) speedThumb.style.left = pct + '%';
    }

    function changeSpeed(delta) {
      let current = 1.0;
      if (speedValueEl) {
        const match = speedValueEl.textContent.match(/×([\d.]+)/);
        if (match) current = parseFloat(match[1]);
      }
      let newSpeed = current + delta * 0.05;
      if (newSpeed < 0.05) newSpeed = 0.05;
      if (newSpeed > 2.0) newSpeed = 2.0;
      newSpeed = Math.round(newSpeed / 0.05) * 0.05;
      updateSpeedDisplay(newSpeed);
      if (window.AndroidBridge && window.AndroidBridge.onSetSpeed) {
        window.AndroidBridge.onSetSpeed(newSpeed);
      }
    }

      btnSpeedPlus.parentNode.replaceChild(newPlus, btnSpeedPlus);
      newPlus.addEventListener('click', function(e) { e.stopPropagation(); changeSpeed(1); });
    }
    fetchSpeed();
    if (window.electronAPI && window.electronAPI.onSpeedChanged) {
      window.electronAPI.onSpeedChanged(function(speed) { if (speed !== undefined && speed !== null) { updateSpeedDisplay(speed); } });
    }

    // ---------- 音轨展开和滚动 ----------
    if (btnTrackToggle) btnTrackToggle.addEventListener('click', () => {
      const scroll = document.getElementById('track-scroll');
      const expanded = scroll.classList.toggle('open');
      btnTrackToggle.textContent = expanded ? '音轨 ▲' : '音轨 ▼';
    });

    // ---------- 音轨滚轮滚动和拖动 ----------
    const trackScroll = document.getElementById('track-scroll');
    if (trackScroll) {
      trackScroll.addEventListener('wheel', function(e) {
        if (this.classList.contains('open')) {
          e.preventDefault();
          this.scrollLeft += e.deltaY;
        }
      }, { passive: false });
      
      let isDragging = false;
      let startX = 0;
      let scrollLeft = 0;
      
      trackScroll.addEventListener('mousedown', function(e) {
        if (!this.classList.contains('open')) return;
        isDragging = true;
        startX = e.pageX - this.offsetLeft;
        scrollLeft = this.scrollLeft;
        this.style.cursor = 'grabbing';
      });
      
      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        const x = e.pageX - trackScroll.offsetLeft;
        const walk = (x - startX) * 1.5;
        trackScroll.scrollLeft = scrollLeft - walk;
      });
      
      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          trackScroll.style.cursor = 'grab';
        }
      });
      
      let touchStartX = 0;
      let touchScrollLeft = 0;
      
      trackScroll.addEventListener('touchstart', function(e) {
        if (!this.classList.contains('open')) return;
        const touch = e.touches[0];
        touchStartX = touch.pageX - this.offsetLeft;
        touchScrollLeft = this.scrollLeft;
      }, { passive: true });
      
      trackScroll.addEventListener('touchmove', function(e) {
        if (!this.classList.contains('open')) return;
        const touch = e.touches[0];
        const x = touch.pageX - this.offsetLeft;
        const walk = (x - touchStartX) * 1.5;
        this.scrollLeft = touchScrollLeft - walk;
      }, { passive: true });
    }

    // ---------- 检测窗口 ----------
    const btnDetectWindow = document.getElementById('btn-detect-window');
    if (btnDetectWindow) {
      btnDetectWindow.addEventListener('click', () => {
        if (window.AndroidBridge && window.AndroidBridge.onDetectWindow) {
          window.AndroidBridge.onDetectWindow();
        }
      });
    }

    // ---------- 进度条/倍速条拖动 ----------
    function bindSeekDrag(barId, onRatio, isSpeed = false) {
      const bar = document.getElementById(barId);
      if (!bar) return;
      let dragging = false;
      let pointerId = null;
      
      function getRatioFromEvent(e) {
        const rect = bar.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let r = (clientX - rect.left) / rect.width;
        if (r < 0) r = 0;
        if (r > 1) r = 1;
        return r;
      }
      
      function updateSlider(ratio) {
        const fill = bar.querySelector('.seekbar-fill');
        const thumb = bar.querySelector('.seekbar-thumb');
        if (fill) fill.style.width = (ratio * 100) + '%';
        if (thumb) thumb.style.left = (ratio * 100) + '%';
        if (isSpeed) {
          const val = document.getElementById('tv-speed-value');
          const SPEED_MIN = 0.05, SPEED_STEP = 0.05, LEVELS = 40;
          let level = Math.round(ratio * (LEVELS - 1));
          if (level < 0) level = 0;
          if (level > LEVELS - 1) level = LEVELS - 1;
          const speed = SPEED_MIN + level * SPEED_STEP;
          if (val) val.textContent = '×' + speed.toFixed(2);
        }
      }
      
      function onStart(e) {
        if (e.type === 'mousedown' && e.button !== 0) return;
        e.preventDefault();
        dragging = true;
        if (e.pointerId !== undefined) { pointerId = e.pointerId; bar.setPointerCapture(pointerId); }
        const ratio = getRatioFromEvent(e);
        updateSlider(ratio);
        onRatio(ratio, true);
      }
      
      function onMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const ratio = getRatioFromEvent(e);
        updateSlider(ratio);
        onRatio(ratio, true);
      }
      
      function onEnd(e) {
        if (!dragging) return;
        dragging = false;
        if (pointerId !== null) { try { bar.releasePointerCapture(pointerId); } catch (e) {} pointerId = null; }
        const ratio = getRatioFromEvent(e);
        updateSlider(ratio);
        onRatio(ratio, false);
      }
      
      function onCancel() {
        if (dragging) { dragging = false; if (pointerId !== null) { try { bar.releasePointerCapture(pointerId); } catch (e) {} pointerId = null; } }
      }
      
      bar.addEventListener('mousedown', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      bar.addEventListener('touchstart', onStart, { passive: false });
      bar.addEventListener('touchmove', onMove, { passive: false });
      bar.addEventListener('touchend', onEnd, { passive: false });
      bar.addEventListener('touchcancel', onCancel, { passive: false });
      bar.addEventListener('click', function(e) {
        if (dragging) return;
        const ratio = getRatioFromEvent(e);
        updateSlider(ratio);
        onRatio(ratio, false);
      });
    }

    bindSeekDrag('seek-bar', (ratio, live) => {
      const cur = document.getElementById('tv-current');
      if (cur) cur.textContent = fmt(curTotalMs * ratio);
      if (!live && window.AndroidBridge && window.AndroidBridge.onSeek) { window.AndroidBridge.onSeek(ratio); }
    }, false);

    bindSeekDrag('seek-speed', (ratio, live) => {
      if (!live && window.AndroidBridge && window.AndroidBridge.onSetSpeed) {
        const SPEED_MIN = 0.05, SPEED_STEP = 0.05, LEVELS = 40;
        let level = Math.round(ratio * (LEVELS - 1));
        if (level < 0) level = 0;
        if (level > LEVELS - 1) level = LEVELS - 1;
        const speed = SPEED_MIN + level * SPEED_STEP;
        window.AndroidBridge.onSetSpeed(speed);
      }
    }, true);

    // ---------- 弹出列表 ----------
    const btnPopupImport = document.getElementById('btn-popup-import');
    const btnPopupClose = document.getElementById('btn-popup-close');
    if (btnPopupImport) btnPopupImport.addEventListener('click', () => { if (window.AndroidBridge && window.AndroidBridge.onPopupImport) window.AndroidBridge.onPopupImport(); });
    if (btnPopupClose) btnPopupClose.addEventListener('click', () => { if (window.AndroidBridge && window.AndroidBridge.onPopupClose) window.AndroidBridge.onPopupClose(); });

    // ---------- 删除动画 ----------
    function animateRemove(row, onDone) {
      if (!row || !row.getBoundingClientRect) { if (onDone) onDone(); return; }
      const height = row.offsetHeight;
      row.style.height = height + 'px';
      row.style.overflow = 'hidden';
      row.style.transition = 'none';
      void row.offsetHeight;
      const DURATION = 200;
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / DURATION);
        const e = 1 - Math.pow(1 - t, 3);
        row.style.opacity = (1 - e).toFixed(3);
        row.style.height = (height * (1 - e)).toFixed(1) + 'px';
        row.style.paddingTop = (14 * (1 - e)).toFixed(1) + 'px';
        row.style.paddingBottom = (14 * (1 - e)).toFixed(1) + 'px';
        row.style.marginTop = (0).toFixed(1) + 'px';
        if (t < 1) { requestAnimationFrame(step); } else { row.style.display = 'none'; if (onDone) onDone(); }
      }
      requestAnimationFrame(step);
    }

    // ---------- API ----------
    window.PianoUI = {
      _playlist: [],
      setPlaylist(list, currentId) {
        this._playlist = list || [];
        const cont = document.getElementById('playlist');
        if (!cont) return;
        cont.innerHTML = '';
        if (!list || list.length === 0) return;
        list.forEach(item => {
          const row = document.createElement('div');
          row.className = 'pl-item';
          const info = document.createElement('div');
          info.className = 'pl-info';
          const nameEl = document.createElement('div');
          nameEl.className = 'pl-name';
          nameEl.textContent = item.name || '未命名';
          if (item.id === currentId) { nameEl.style.color = 'var(--accent-soft)'; }
          info.appendChild(nameEl);
          const del = document.createElement('div');
          del.className = 'pl-del';
          del.textContent = '✕';
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.AndroidBridge && window.AndroidBridge.onDeleteItem) { window.AndroidBridge.onDeleteItem(item.id); }
          });
          row.appendChild(info);
          row.appendChild(del);
          row.addEventListener('click', () => {
            if (window.AndroidBridge && window.AndroidBridge.onSelectItem) { window.AndroidBridge.onSelectItem(item.id); }
          });
          cont.appendChild(row);
        });
      },
      setOverlayChecked(v) { const sw = document.getElementById('sw-overlay'); if (sw) sw.checked = v; },
      setTitle(title, subtitle) {
        const t = document.getElementById('tv-title');
        const s = document.getElementById('tv-subtitle');
        if (t) t.textContent = title || '未选择乐曲';
        if (s) s.textContent = subtitle || '';
      },
      setStatusText(text) { const s = document.getElementById('tv-subtitle'); if (s) s.textContent = text || ''; },
      setDetectHint(text) {
        const h = document.getElementById('detect-hint');
        if (h) {
          h.textContent = text || '播放前请先检测窗口';
        }
      },
      setDetectLocked(locked) {
        const b = document.getElementById('btn-detect-window');
        if (b) {
          if (locked) b.classList.add('locked');
          else b.classList.remove('locked');
        }
      },
      setPlaying(playing) {
        const play = document.getElementById('icon-play');
        const pause = document.getElementById('icon-pause');
        if (play) play.style.display = playing ? 'none' : '';
        if (pause) pause.style.display = playing ? '' : 'none';
      },
      setProgress(currentMs, totalMs) {
        const cf = document.getElementById('tv-current');
        const tf = document.getElementById('tv-total');
        const fill = document.getElementById('seek-fill');
        const thumb = document.getElementById('seek-thumb');
        curTotalMs = totalMs || 120000;
        if (cf) cf.textContent = fmt(currentMs || 0);
        if (tf) tf.textContent = fmt(totalMs || 120000);
        const pct = totalMs > 0 ? ((currentMs || 0) / totalMs * 100) : 0;
        if (fill) fill.style.width = pct + '%';
        if (thumb) thumb.style.left = pct + '%';
      },
      setSpeed(speed) { if (speed !== undefined && speed !== null) { updateSpeedDisplay(speed); } },
      setTracks(tracks) {
        const cont = document.getElementById('track-list');
        if (!cont) return;
        
        const scroll = document.getElementById('track-scroll');
        const scrollLeft = scroll ? scroll.scrollLeft : 0;
        const list = tracks || [];
        
        const existingItems = cont.querySelectorAll('.track-item');
        
        if (existingItems.length === list.length && existingItems.length > 0) {
          existingItems.forEach((item, index) => {
            const t = list[index];
            if (!t) return;
            const isChecked = t.enabled !== false;
            item.classList.toggle('checked', isChecked);
            const nameEl = item.querySelector('.track-name');
            const countEl = item.querySelector('.track-count');
            if (nameEl) nameEl.textContent = t.name || '音轨 ' + (t.index + 1);
            if (countEl) countEl.textContent = (t.noteCount || 0) + ' 个音符';
            item.dataset.index = t.index;
          });
          if (scroll) scroll.scrollLeft = scrollLeft;
          return;
        }
        
        if (existingItems.length > list.length) {
          for (let i = list.length; i < existingItems.length; i++) {
            existingItems[i].remove();
          }
        }
        
        const currentItems = cont.querySelectorAll('.track-item');
        list.forEach((t, index) => {
          const isChecked = t.enabled !== false;
          let item = currentItems[index];
          
          if (!item) {
            item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `
              <span class="track-checkbox"></span>
              <span class="track-text">
                <span class="track-name"></span>
                <span class="track-count"></span>
              </span>
            `;
            item.addEventListener('click', function(e) {
              e.stopPropagation();
              const isNowChecked = !this.classList.contains('checked');
              this.classList.toggle('checked', isNowChecked);
              if (window.AndroidBridge && window.AndroidBridge.toggleTrackMute) {
                window.AndroidBridge.toggleTrackMute(parseInt(this.dataset.index));
              }
            });
            cont.appendChild(item);
          }
          
          item.classList.toggle('checked', isChecked);
          item.dataset.index = t.index;
          const nameEl = item.querySelector('.track-name');
          const countEl = item.querySelector('.track-count');
          if (nameEl) nameEl.textContent = t.name || '音轨 ' + (t.index + 1);
          if (countEl) countEl.textContent = (t.noteCount || 0) + ' 个音符';
        });
        
        if (scroll) scroll.scrollLeft = 0;
      },
      setPopupList(list, currentId) {
        const cont = document.getElementById('popup-list');
        if (!cont) return;
        cont.innerHTML = '';
        if (!list || list.length === 0) return;
        list.forEach(item => {
          const row = document.createElement('div');
          row.className = 'pl-item';
          const info = document.createElement('div');
          info.className = 'pl-info';
          const nameEl = document.createElement('div');
          nameEl.className = 'pl-name';
          nameEl.textContent = item.name || '未命名';
          if (item.id === currentId) { nameEl.style.color = 'var(--accent-soft)'; }
          info.appendChild(nameEl);
          const del = document.createElement('div');
          del.className = 'pl-del';
          del.textContent = '✕';
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.AndroidBridge && window.AndroidBridge.onDeletePopupItem) { window.AndroidBridge.onDeletePopupItem(item.id); }
          });
          row.appendChild(info);
          row.appendChild(del);
          row.addEventListener('click', () => {
            if (window.AndroidBridge && window.AndroidBridge.onSelectItem) { window.AndroidBridge.onSelectItem(item.id); }
          });
          cont.appendChild(row);
        });
      }
    };

    function fmt(ms) {
      const s = Math.floor((ms || 0) / 1000);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return (m < 10 ? '0' + m : m) + ':' + (sec < 10 ? '0' + sec : sec);
    }

    // ---------- MIDI 事件监听 ----------
    if (window.electronAPI) {
      window.electronAPI.onThemeChanged((color) => {
        if (color && typeof color === 'string' && color.startsWith('#') && typeof applyAccent === 'function') {
          applyAccent(color);
        }
      });
      
      window.electronAPI.onSetFloatMode((mode) => {
        if (mode && window.AndroidBridge && window.AndroidBridge.getThemeColor) {
          window.AndroidBridge.getThemeColor().then(color => {
            if (color && typeof applyAccent === 'function') { applyAccent(color); }
          }).catch(() => {});
        }
      });
      
      window.electronAPI.onSetTitle((title, subtitle) => {
        if (window.PianoUI && window.PianoUI.setTitle) {
          window.PianoUI.setTitle(title, subtitle || '');
        }
      });
      
      window.electronAPI.onSetStatus((text) => {
        if (window.PianoUI && window.PianoUI.setStatusText) { window.PianoUI.setStatusText(text); }
      });
      
      window.electronAPI.onUpdateTracks((tracks) => {
        if (window.PianoUI && window.PianoUI.setTracks) { window.PianoUI.setTracks(tracks); }
      });
      
      window.electronAPI.onProgressUpdate((data) => {
        if (window.PianoUI && window.PianoUI.setProgress) {
          window.PianoUI.setProgress(data.currentMs, data.totalMs);
        }
      });
      
      window.electronAPI.onPlayStateChanged((playing) => {
        if (window.PianoUI && window.PianoUI.setPlaying) {
          window.PianoUI.setPlaying(playing);
        }
      });

      // ---------- 悬浮窗开关状态同步（当悬浮窗被关闭时，主页开关回到未选中） ----------
      window.electronAPI.onOverlayStateChanged((checked) => {
        const sw = document.getElementById('sw-overlay');
        if (sw) {
          sw.checked = !!checked;
        }
      });

      // ---------- 检测窗口倒计时（UI 侧自己跑，绝对丝滑） ----------
      window.electronAPI.onDetectCountdownStart((seconds) => {
        let n = seconds;
        const h = document.getElementById('detect-hint');
        if (h) h.textContent = '检测中... ' + n + 's';
        if (window._detectTimer) {
          clearInterval(window._detectTimer);
          window._detectTimer = null;
        }
        window._detectTimer = setInterval(() => {
          n--;
          if (n > 0) {
            if (h) h.textContent = '检测中... ' + n + 's';
          } else {
            clearInterval(window._detectTimer);
            window._detectTimer = null;
            if (h) h.textContent = '检测中...';
          }
        }, 1000);
      });

      window.electronAPI.onDetectResult((data) => {
        if (window.PianoUI && window.PianoUI.setDetectHint) {
          if (data.hint) {
            window.PianoUI.setDetectHint(data.hint);
          }
        }
        if (window.PianoUI && window.PianoUI.setDetectLocked) {
          window.PianoUI.setDetectLocked(data.locked || false);
        }
      });
    }

  })();
</script>
</body></html>
